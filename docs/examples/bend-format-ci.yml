name: Bend format example

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build offline format tool
        run: ./gradlew --no-daemon buildFormatTool
      - name: Check every tracked Bend file
        run: bash ci/bend-format-all-tracked.sh
