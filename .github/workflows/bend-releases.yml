name: Bend release compatibility

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Specific published Bend tag to test again (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: bend-release-compatibility
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test unseen published Bend releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEND_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 ci/bend_release_monitor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bend-release-results
          path: build/bend-release-monitor-results.json
          if-no-files-found: ignore

  record:
    needs: compatibility
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Updates only the separate result branch.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bend-release-results
          path: build
      - name: Record completed candidate results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/bend_release_monitor.py --record
