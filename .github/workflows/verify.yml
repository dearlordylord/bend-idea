name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, check architecture, package and verify compatibility
        run: ./gradlew --no-daemon check buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: bend-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
